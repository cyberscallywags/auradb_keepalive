# GitHub Actions CI for Cyber Scallywags projects.
# Adjust the language setup/commands to match your stack, then update the CI
# badge URL in README.md to point at this workflow file.
name: CI

on:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  pull_request:
    branches: ["{{DEFAULT_BRANCH}}"]

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q || echo "No tests yet — remove this fallback once tests exist."

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Only build if a Dockerfile is present.
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t {{REPO}}:ci .
          else
            echo "No Dockerfile — skipping."
          fi
